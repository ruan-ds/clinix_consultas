<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clinix</title>
    <link rel="stylesheet" href="../src/css/login.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <img src="https://via.placeholder.com/100x80?text=CLINIX" alt="Clinix Logo" class="logo">
            
            <form>
                <div class="input-group">
                    <input type="text" placeholder="E-mail ou CPF">
                </div>
                
                <div class="input-group">
                    <input type="password" placeholder="Senha">
                </div>
                
                <button type="submit" class="btn-entrar">ENTRAR</button>
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
            </form>

            <p class="signup-text">Ainda não tem uma conta? <a href="#">Cadastre-se</a></p>
        </div>

        <div class="info-card">
            <h1>Agende consultas com 1 Clicke</h1>
            <p>Acesse milhares de especialistas e gerencie sua saúde</p>
        </div>
    </div>
</body>
</html>

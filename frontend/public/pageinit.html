<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial</title>
    <link rel="stylesheet" href="../src/css/pageinit.css">
    <link rel="shortcut icon" href="../src/assets/images/Clinix.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="top-header">
        <div class="logo">
            <img src="../src/assets/images/logo.png" alt="Clinix Logo">
        </div>
        <nav class="top-nav">
            <a href="#">CLINIX</a>
        </nav>
        <div class="user-profile">
            <i class="fa-solid fa-circle-user"></i>
        </div>
    </header>

    <div class="main-container">
    <aside class="sidebar">
        <nav class="side-nav">
            <a href="#" class="active"><i class="fa-solid fa-house"></i> <span>Dashboard</span></a>
            <a href="#"><i class="fa-regular fa-calendar-plus"></i> <span>Agendar Consulta</span></a>
            <a href="#"><i class="fa-solid fa-user-doctor"></i> <span>Meus Médicos</span></a>
            <a href="#"><i class="fa-regular fa-credit-card"></i> <span>Pagamentos</span></a>
            <a href="#"><i class="fa-solid fa-gear"></i> <span>Configurações</span></a>
        </nav>
    </aside>

        <main class="content">
            <div class="empty-state">
                <div class="illustration">
                    <div class="calendar-icon">
                        <img src="../src/assets/images/calendarioimg.png" alt="">
                    </div>
                </div>
                
                <h1>Bem-vindo, User! Vamos agendar sua primeira consulta?</h1>
                <p>Você ainda não tem agendamentos ou históricos. Comece agora!</p>
                
                <button class="btn-primary">Agendar minha primeira consulta</button>
            </div>
        </main>
    </div>

</body>
</html>

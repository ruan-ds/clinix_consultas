[tool.poetry]
name = "clinix-backend"
version = "0.1.0"
description = "Clinix BPO - Sistema de Agendamento"
authors = ["Seu Nome <seu@email.com>"]
readme = "README.md"
package-mode = true
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.129.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
sqlalchemy = "^2.0.46"
pymysql = "^1.1.2"
pydantic-settings = "^2.12.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.22"
cryptography = "^46.0.5"
pytest = "^9.0.2"
alembic = "^1.18.4"
pydantic = "^2.12.5"
psycopg = {extras = ["binary"], version = "^3.3.3"}

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "ruff (>=0.15.6,<0.16.0)"
]
